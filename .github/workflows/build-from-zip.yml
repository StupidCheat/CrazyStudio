name: Build IPA desde ZIP

on:
  push:
    paths:
      - '*.zip'          # se ejecuta al subir/actualizar un .zip en la raíz
  workflow_dispatch:

permissions:
  contents: write        # para publicar el IPA en Releases

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Descomprimir el ZIP
        run: |
          ZIP=$(ls -1 *.zip 2>/dev/null | head -n 1)
          if [ -z "$ZIP" ]; then echo "No hay ningún .zip en la raíz del repo"; exit 1; fi
          echo "Usando: $ZIP"
          mkdir -p _src
          unzip -q "$ZIP" -d _src
          SPEC=$(find _src -name project.yml | head -n 1)
          if [ -z "$SPEC" ]; then echo "No se encontró project.yml dentro del ZIP"; exit 1; fi
          echo "PROJECT_DIR=$(dirname "$SPEC")" >> "$GITHUB_ENV"

      - name: Instalar XcodeGen
        run: brew install xcodegen

      - name: Generar proyecto Xcode
        working-directory: ${{ env.PROJECT_DIR }}
        run: xcodegen generate

      - name: Compilar (sin firmar)
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          xcodebuild -project LocalVideoShare.xcodeproj \
            -scheme LocalVideoShare \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build

      - name: Empaquetar IPA
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/LocalVideoShare.app Payload/
          zip -qr LocalVideoShare.ipa Payload

      - name: Subir IPA como Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LocalVideoShare-ipa
          path: ${{ env.PROJECT_DIR }}/LocalVideoShare.ipa
          if-no-files-found: error

      - name: Publicar IPA en Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ipa-${{ github.run_number }}
          name: IPA #${{ github.run_number }}
          files: ${{ env.PROJECT_DIR }}/LocalVideoShare.ipa
